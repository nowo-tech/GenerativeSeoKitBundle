services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\GenerativeSeoKitBundle\Service\ConfigCitationSourceProvider:
        arguments:
            $config: '%nowo_generative_seo_kit.config%'
        tags: ['nowo_generative_seo_kit.citation_source_provider']

    Nowo\GenerativeSeoKitBundle\Service\RouteCitationSourceProvider:
        arguments:
            $config: '%nowo_generative_seo_kit.config%'
            $urlGenerator: '@?router'
        tags: ['nowo_generative_seo_kit.citation_source_provider']

    Nowo\GenerativeSeoKitBundle\Service\ConfigGeoRuntimeConfig:
        arguments:
            $config: '%nowo_generative_seo_kit.config%'

    # Default SPI implementation; hosts override this alias with their own GeoRuntimeConfigInterface service.
    Nowo\GenerativeSeoKitBundle\Service\GeoRuntimeConfigInterface: '@Nowo\GenerativeSeoKitBundle\Service\ConfigGeoRuntimeConfig'

    Nowo\GenerativeSeoKitBundle\Service\LlmsTxtGenerator:
        arguments:
            $config: '%nowo_generative_seo_kit.config%'
            $runtime: '@Nowo\GenerativeSeoKitBundle\Service\GeoRuntimeConfigInterface'
            $citationProviders: !tagged_iterator nowo_generative_seo_kit.citation_source_provider

    Nowo\GenerativeSeoKitBundle\Service\SeoKitRobotsGroupsProvider:
        arguments:
            $config: '%nowo_generative_seo_kit.config%'
            $runtime: '@Nowo\GenerativeSeoKitBundle\Service\GeoRuntimeConfigInterface'

    Nowo\GenerativeSeoKitBundle\Service\GenerativeSeoAuditor: ~

    # autoconfigure: false (REQ-SF-004 rule 7) — on Symfony >= 7.3 a #[Route] class is autoconfigured with the
    # routing.controller tag, and the host's `routing.controllers` resource would then expose /llms.txt & co.
    # on their default paths without the `nowo_generative_seo_kit` route import (opt-in only).
    Nowo\GenerativeSeoKitBundle\Controller\LlmsTxtController:
        autoconfigure: false
        tags: ['controller.service_arguments']
        public: true

    Nowo\GenerativeSeoKitBundle\Routing\LlmsTxtRouteLoader:
        arguments:
            $config: '%nowo_generative_seo_kit.config%'
        tags: ['routing.loader']

    Nowo\GenerativeSeoKitBundle\Command\GenerativeSeoAuditCommand: ~
